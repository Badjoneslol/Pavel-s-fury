name: Construire l'APK Android
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#0d0a11' --iconBackgroundColorDark '#0d0a11'
      - run: npx cap sync android
      # Toujours la même clé de signature : Android accepte alors la mise à jour par-dessus l'ancienne version, et la sauvegarde est conservée
      - run: mkdir -p ~/.android && cp signature/pavels-fury-debug.keystore ~/.android/debug.keystore
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk pavels-fury.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pavels-fury-apk
          path: pavels-fury.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pavel's Fury (build ${{ github.run_number }})
          files: pavels-fury.apk
